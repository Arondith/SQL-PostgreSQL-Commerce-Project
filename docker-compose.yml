services:
  postgres:
    image: postgres:17-alpine
    container_name: commerceledger-postgres
    environment:
      POSTGRES_DB: commerceledger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d commerceledger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
